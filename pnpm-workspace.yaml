packages:
  - 'apps/*/*'
  - 'packages/*'

overrides:
  # Taro 4.2 ships a @tarojs/webpack5-runner that only validates against
  # webpack's schema shape from 5.91. Newer webpack (5.100+) added stricter
  # checks on ProgressPlugin options and breaks `taro build`.
  webpack: '5.91.0'
  # Force a single @types/react version workspace-wide. Otherwise miniapp's
  # React 18 types collide with the React 19 types consumed by web / native
  # (because @tanstack/react-query et al. pull @types/react@18 transitively),
  # producing spurious "Type 'bigint' is not assignable to ReactNode" errors.
  '@types/react': '^19.2.14'
  '@types/react-dom': '^19.2.3'
  # Keep production audit green while upstream frameworks catch up.
  'brace-expansion@1.1.14': '1.1.20'
  'brace-expansion@5.0.5': '5.0.11'
  browserslist: '^4.28.7'
  deepmerge-ts: '^8.0.0'
  ip-address: '^10.3.1'
  multer: '^2.3.0'
  proxy-addr: '^2.0.8'

# All ignored advisories live in transitive deps of @cardhub/miniapp's
# Taro 4.2 build toolchain (swiper/lodash-es/fast-uri inside @tarojs/*
# packages). They never ship to production web or api. Forcing them via
# pnpm overrides re-resolves the lockfile in a way that flips pnpm's
# @types/react hoist choice and breaks workspace typecheck across
# web ↔ miniapp. Revisit when Taro 4.x picks up patched versions upstream.
auditConfig:
  ignoreCves:
    - 'CVE-2026-27212' # swiper prototype pollution (via @tarojs/components)
    - 'CVE-2026-4800' # lodash-es _.template (via @tarojs/plugin-platform-h5)
    - 'CVE-2026-6321' # fast-uri path traversal (via webpack → ajv chain)
    - 'CVE-2026-6322' # fast-uri host confusion (via webpack → ajv chain)

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tarojs/binding'
  - '@tarojs/cli'
  - 'bcrypt'
  - 'core-js'
  - 'core-js-pure'
  - 'esbuild'
  - 'prisma'
