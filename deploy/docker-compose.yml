x-logging: &json-file-logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  api:
    image: ghcr.io/xv-jiaqi/cardhub-api:${IMAGE_TAG}
    restart: unless-stopped
    logging: *json-file-logs
    # tini forwards SIGTERM to node. The process stops accepting connections
    # and finishes in-flight HTTP requests before it exits. 30s is the ceiling
    # for that drain. remote-deploy.sh passes the same value to `docker stop -t`.
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      # Runtime DML role only. Do not put MIGRATE_DATABASE_URL here: tini is
      # PID 1 (init: true) and node can read /proc/1/environ.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # Only the exact string true writes sha256$ password hashes. Anything
      # else, including an empty value, stays on legacy bcrypt. Deploy copies
      # the GitHub Environment variable into the env file when it is true or
      # false, and leaves this line unchanged when that variable is unset.
      PASSWORD_PREHASH_WRITE: ${PASSWORD_PREHASH_WRITE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Absolute web origin for sitemap <loc>. An empty PUBLIC_WEB_ORIGIN uses
      # https://WEB_DOMAIN. WEB_DOMAIN must be set in that case; compose stops
      # instead of publishing https://.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://${WEB_DOMAIN:?WEB_DOMAIN is required}}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-${ENV_NAME:-}}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE}
      # fatal | error | warn | info | debug | trace | silent. Invalid values
      # fall back to info inside the API.
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases:
          - ${ENV_NAME}-api
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # One-shot. Not started by `up` (profile). remote-deploy.sh runs
  # `docker compose run --rm --no-deps migrate` before the API rollout.
  # This is the only service that receives MIGRATE_DATABASE_URL. An empty
  # value makes migrate-entrypoint.sh fall back to DATABASE_URL.
  migrate:
    image: ghcr.io/xv-jiaqi/cardhub-api:${IMAGE_TAG}
    profiles: ['migrate']
    restart: 'no'
    logging: *json-file-logs
    command: ['/usr/local/bin/migrate-entrypoint.sh']
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:

  web:
    image: ghcr.io/xv-jiaqi/cardhub-web:${IMAGE_TAG}
    restart: unless-stopped
    logging: *json-file-logs
    stop_grace_period: 30s
    environment:
      TRPC_URL: ${TRPC_URL}
      # Rewrites robots.txt Sitemap. An empty PUBLIC_WEB_ORIGIN uses
      # https://WEB_DOMAIN. WEB_DOMAIN must be set in that case; compose stops
      # instead of publishing https://.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-https://${WEB_DOMAIN:?WEB_DOMAIN is required}}
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-${ENV_NAME:-}}
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      edge:
        aliases:
          - ${ENV_NAME}-web
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *json-file-logs
    # Do not publish database ports. Docker-published ports bypass host firewalls
    # such as ufw; keep Postgres reachable only on the project network.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *json-file-logs
    # Do not publish Redis ports. Docker-published ports bypass host firewalls
    # such as ufw; keep Redis reachable only on the project network.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      [
        'sh',
        '-c',
        'printf "appendonly yes\nrequirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  edge:
    external: true

volumes:
  postgres_data:
  redis_data:
