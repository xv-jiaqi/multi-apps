services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ENV_NAME: ${ENV_NAME}
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      STAGING_WEB_DOMAIN: ${STAGING_WEB_DOMAIN}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
