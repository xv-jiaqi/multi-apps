services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ENV_NAME: ${ENV_NAME}
      ROOT_WEB_DOMAINS: ${ROOT_WEB_DOMAINS:-http://root-web-disabled.invalid}
      ROOT_WEB_REDIRECT_DOMAINS: ${ROOT_WEB_REDIRECT_DOMAINS:-http://root-web-redirect-disabled.invalid}
      ROOT_WEB_REDIRECT_TARGET: ${ROOT_WEB_REDIRECT_TARGET:-card-hub.app}
      API_DOMAIN: ${API_DOMAIN}
      STAGING_WEB_DOMAIN: ${STAGING_WEB_DOMAIN}
      STAGING_API_DOMAIN: ${STAGING_API_DOMAIN}
    volumes:
      # Mount the directory. A single-file bind of Caddyfile keeps the inode
      # from container create, so tar (unlink + create) leaves Caddy reading
      # the old file while optional/ — a directory mount — already shows the
      # new one.
      - ./:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
