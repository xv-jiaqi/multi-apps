name: cardhub-dev

x-logging: &json-file-logs
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cardhub-postgres
    restart: unless-stopped
    logging: *json-file-logs
    environment:
      POSTGRES_USER: cardhub
      POSTGRES_PASSWORD: cardhub
      POSTGRES_DB: cardhub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cardhub -d cardhub']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardhub-redis
    restart: unless-stopped
    logging: *json-file-logs
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cardhub-pgadmin
    restart: unless-stopped
    logging: *json-file-logs
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@cardhub.local
      PGADMIN_DEFAULT_PASSWORD: cardhub
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
