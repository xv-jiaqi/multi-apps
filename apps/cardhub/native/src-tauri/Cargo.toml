[package]
name = "cardhub"
version = "0.0.0"
description = "Cardhub native shell (Desktop + iOS + Android)"
edition = "2021"
rust-version = "1.77"

# lib target is required for mobile (iOS/Android) support in Tauri v2.
[lib]
name = "cardhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enable custom-protocol builds (used by `tauri build`).
custom-protocol = ["tauri/custom-protocol"]
