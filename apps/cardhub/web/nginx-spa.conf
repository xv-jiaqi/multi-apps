server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    add_header Cache-Control "no-cache";

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files  $uri =404;
    }

    location ~* ^/assets/.+-[0-9A-Za-z_-]+\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files  $uri =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
