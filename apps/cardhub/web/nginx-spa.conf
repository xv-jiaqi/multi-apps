server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Locations that set their own add_header drop server-level headers, so each
    # one includes this snippet. The entrypoint rewrites the file from TRPC_URL
    # and SENTRY_DSN before nginx starts.
    include /etc/nginx/conf.d/security-headers.inc;

    add_header Cache-Control "no-cache" always;

    location = /config.js {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files  $uri =404;
    }

    # /assets/*.map is not a published asset. location / would serve the
    # file or fall back to index.html.
    location ~* ^/assets/.+\.map$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~* ^/assets/.+-[0-9A-Za-z_-]+\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|gif)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files  $uri =404;
    }

    location = /healthz {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 'ok';
    }

    # The SPA HTML also carries the API preconnect Link header (CH-240). An
    # add_header here drops the server-level ones, so they are repeated.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/api-preconnect.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
