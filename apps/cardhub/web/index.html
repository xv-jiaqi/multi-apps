<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      iOS / iPadOS Tauri WebView treats the bundle as a standalone web app.
      `apple-mobile-web-app-capable` removes the Safari chrome; the status-bar
      style stays on the default light tone so the indigo gradient header
      stays legible against the system clock. Android's Tauri WebView ignores
      these and reads the manifest separately.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cardhub" />
    <meta name="theme-color" content="#ffffff" />
    <title>Cardhub</title>
  </head>
  <body class="min-h-screen bg-neutral-50 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
