name: Cardhub Images

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: Dockerfile.api
            image: ghcr.io/xv-jiaqi/cardhub-api
          - name: web
            file: Dockerfile.web
            image: ghcr.io/xv-jiaqi/cardhub-web
    # API boot needs both. The web leg starts them too; they are idle there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardhub
          POSTGRES_PASSWORD: cardhub
          POSTGRES_DB: cardhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardhub -d cardhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ matrix.image }}:main

      # Push already happened and is unchanged. This step does not push or
      # retag. It runs image@digest from the build step. The digest artifact
      # below is written only after the container boots, so a failed boot
      # fails the job before deploy will accept a digest. Deploy still pulls
      # image@digest from a successful run.
      - name: Boot ${{ matrix.name }} image
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ROLE: ${{ matrix.name }}
          EXPECTED_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${IMAGE}" =~ ^ghcr\.io/xv-jiaqi/cardhub-(api|web)$ ]]; then
            echo "Unexpected image name" >&2
            exit 1
          fi
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing to boot an image digest that is not sha256:<64 hex>" >&2
            exit 1
          fi
          if [[ "${ROLE}" != "api" && "${ROLE}" != "web" ]]; then
            echo "Unexpected image role" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_GIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EXPECTED_GIT_SHA is not 40 hex characters" >&2
            exit 1
          fi
          ref="${IMAGE}@${DIGEST}"
          echo "Booting ${ref}"
          docker pull "${IMAGE}@${DIGEST}"
          name="cardhub-${ROLE}-boot"
          docker rm -f "$name" >/dev/null 2>&1 || true
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              if docker inspect "$name" >/dev/null 2>&1; then
                echo "::group::${ROLE} container logs"
                docker logs "$name" || true
                echo "::endgroup::"
              fi
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          if [ "$ROLE" = "api" ]; then
            # Compose runs migrate in a one-shot container, then starts the
            # API without MIGRATE_DATABASE_URL. /health is SELECT 1; migrate
            # is what deploy does before the process is serving.
            docker run --rm --network host \
              -e DATABASE_URL='postgresql://cardhub:cardhub@127.0.0.1:5432/cardhub_test?schema=public' \
              --entrypoint /usr/local/bin/migrate-entrypoint.sh \
              "${IMAGE}@${DIGEST}"
            jwt_secret="$(openssl rand -hex 32)"
            if [ "${#jwt_secret}" -ne 64 ]; then
              echo "Refusing to start the API with a JWT_SECRET that is not 32 bytes" >&2
              exit 1
            fi
            docker run -d --name "$name" --network host \
              -e DATABASE_URL='postgresql://cardhub:cardhub@127.0.0.1:5432/cardhub_test?schema=public' \
              -e JWT_SECRET="$jwt_secret" \
              -e REDIS_HOST=127.0.0.1 \
              -e REDIS_PORT=6379 \
              "${IMAGE}@${DIGEST}"
            API_BASE_URL=http://127.0.0.1:4000 \
              API_CONTAINER="$name" \
              bash scripts/check-api-health.sh
          else
            docker run -d --name "$name" -p 127.0.0.1:8080:8080 \
              -e TRPC_URL=http://127.0.0.1:4000/trpc \
              "${IMAGE}@${DIGEST}"
            WEB_BASE_URL=http://127.0.0.1:8080 \
              WEB_CONTAINER="$name" \
              bash scripts/check-web-image.sh
          fi

      # Export JS + maps from the web builder (same GIT_SHA as the pushed
      # image) and upload when SENTRY_AUTH_TOKEN is set. Runs before the
      # digest artifact is published so a failed upload does not become
      # the deployable SHA. Unset token still exits 0 (CH-247).
      # JQ-Boss configures repo secret SENTRY_AUTH_TOKEN and repo variables
      # SENTRY_ORG / SENTRY_PROJECT (optional SENTRY_URL). DSN ≠ auth token.
      - name: Export Web source maps
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          target: sourcemaps
          push: false
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/web-sourcemaps
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=web

      - name: Upload Sentry source maps
        if: matrix.name == 'web'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha }}
          SENTRY_DIST_DIR: ${{ runner.temp }}/web-sourcemaps/dist
        run: |
          set -euo pipefail
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            dest="${RUNNER_TEMP}/sentry-cli-bin"
            bash apps/cardhub/web/scripts/install-sentry-cli.sh "$dest"
            export PATH="${dest}:${PATH}"
          fi
          bash apps/cardhub/web/scripts/upload-sentry-sourcemaps.sh

      # The tag can move again after this step. Deploy reads this file from
      # the successful run and pulls image@digest, not the tag.
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing to publish an image digest that is not sha256:<64 hex>" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/image-digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/image-digest/digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/image-digest/digest
          retention-days: 90
          if-no-files-found: error
