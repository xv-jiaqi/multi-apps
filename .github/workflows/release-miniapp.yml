name: Release Miniapp

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Mini-program target (weapp/alipay/tt/swan/qq/h5)'
        required: true
        default: 'weapp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10.18.2, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cardhub/miniapp --fail-if-no-match exec pnpm run miniapp:${{ github.event.inputs.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cardhub-miniapp-${{ github.event.inputs.target }}
          path: apps/cardhub/miniapp/dist/${{ github.event.inputs.target }}/**
