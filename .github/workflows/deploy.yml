name: Cardhub Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment and VPS env file
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: Image tag to deploy. Production requires sha-<full-git-sha>; staging also accepts main.
        required: true
        default: main
  workflow_run:
    workflows: ['Cardhub Images']
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: cardhub-deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cardhub
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deploy inputs
        id: deploy-inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            deploy_environment="staging"
            expected_sha="${WORKFLOW_RUN_HEAD_SHA}"
            image_tag="sha-${expected_sha}"
          else
            deploy_environment="${INPUT_ENVIRONMENT}"
            image_tag="${INPUT_IMAGE_TAG}"

            if [[ "${deploy_environment}" != "staging" && "${deploy_environment}" != "production" ]]; then
              echo "Invalid environment: ${deploy_environment}" >&2
              exit 1
            fi

            if [[ "${deploy_environment}" == "staging" && "${image_tag}" == "main" ]]; then
              expected_sha="$(git ls-remote origin refs/heads/main | awk '{ print $1 }')"
              image_tag="sha-${expected_sha}"
            elif [[ "${image_tag}" =~ ^sha-[0-9a-f]{40}$ ]]; then
              expected_sha="${image_tag#sha-}"
            else
              echo "Invalid image_tag '${image_tag}'. Production requires sha-<40 hex>; staging accepts sha-<40 hex> or main." >&2
              exit 1
            fi
          fi

          if [[ ! "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a full deployment SHA" >&2
            exit 1
          fi

          git checkout --detach "${expected_sha}"

          echo "environment=${deploy_environment}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "expected_sha=${expected_sha}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH with pinned host key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KNOWN_HOSTS}" ]]; then
            echo "DEPLOY_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Sync deploy files
        shell: bash
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          tar -C deploy -czf - docker-compose.yml remote-deploy.sh backup.sh edge \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${remote}" \
                'mkdir -p /opt/cardhub/deploy && tar -xzf - -C /opt/cardhub/deploy'

      - name: Deploy on VPS
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.deploy-inputs.outputs.environment }}
          DEPLOY_IMAGE_TAG: ${{ steps.deploy-inputs.outputs.image_tag }}
          DEPLOY_EXPECTED_SHA: ${{ steps.deploy-inputs.outputs.expected_sha }}
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_environment="$(printf '%q' "${DEPLOY_ENVIRONMENT}")"
          image_tag="$(printf '%q' "${DEPLOY_IMAGE_TAG}")"
          expected_sha="$(printf '%q' "${DEPLOY_EXPECTED_SHA}")"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${remote}" \
            "bash /opt/cardhub/deploy/remote-deploy.sh ${deploy_environment} ${image_tag} ${expected_sha}"
