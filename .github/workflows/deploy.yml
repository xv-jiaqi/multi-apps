name: Cardhub Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment and VPS env file
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      image_tag:
        description: Image tag to deploy. Production requires sha-<full-git-sha>; staging also accepts main.
        required: true
        default: main
      recreate_edge:
        description: Recreate the shared edge Caddy container so it picks up the directory mount. Briefly interrupts every domain. Leave this off unless you mean to do that switch.
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

permissions: {}

# One in-progress app deploy per environment. The shared edge job below has
# its own group so staging and production cannot apply Caddy at the same time.
# cancel-in-progress is false: a new run does not cancel the running one.
# GitHub's default queue is single, so a group still holds only one pending
# run; a third arrival cancels that pending run and takes its place.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
  cancel-in-progress: false

jobs:
  edge:
    name: Sync shared edge
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    concurrency:
      group: cardhub-edge
      cancel-in-progress: false
    environment: ${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.deploy-inputs.outputs.environment }}
      image_tag: ${{ steps.deploy-inputs.outputs.image_tag }}
      expected_sha: ${{ steps.deploy-inputs.outputs.expected_sha }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Full history so the ancestor check in resolve-deploy-inputs.sh
          # stays stable. A depth-1 fetch can still compare the deploy tree.
          fetch-depth: 0

      - name: Validate deploy inputs
        id: deploy-inputs
        shell: bash
        run: bash deploy/resolve-deploy-inputs.sh

      - name: Configure SSH with pinned host key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KNOWN_HOSTS}" ]]; then
            echo "DEPLOY_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      # Keep this step immediately above "Sync edge files". A main commit that
      # changes deploy/ between the earlier resolve and this fetch must fail
      # here, before the tar is uploaded.
      - name: Re-check deploy tree before sync
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.deploy-inputs.outputs.environment }}
          DEPLOY_IMAGE_TAG: ${{ steps.deploy-inputs.outputs.image_tag }}
          DEPLOY_EXPECTED_SHA: ${{ steps.deploy-inputs.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash deploy/resolve-deploy-inputs.sh --assert

      - name: Sync edge files
        shell: bash
        env:
          # workflow_run has no inputs. Only an explicit manual true may recreate.
          RECREATE_EDGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.recreate_edge == 'true' }}
          DEPLOY_ENVIRONMENT: ${{ steps.deploy-inputs.outputs.environment }}
          DEPLOY_IMAGE_TAG: ${{ steps.deploy-inputs.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Refusing to sync edge files from $(git rev-parse HEAD); workflow ref is ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "Syncing edge files from workflow ref ${GITHUB_SHA}; image tag ${DEPLOY_IMAGE_TAG} is not a git checkout"

          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          edge_dir="/opt/cardhub/edge/deploy/edge"
          edge_parent="/opt/cardhub/edge"
          edge_dir_q="$(printf '%q' "${edge_dir}")"
          parent_q="$(printf '%q' "${edge_parent}")"
          pending_q="$(printf '%q' "${edge_parent}/.edge-sync-pending")"
          stamp_q="$(printf '%q' "${edge_parent}/.applied-tree-sha256")"

          ssh_edge() {
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${remote}" "$@"
          }

          tree_hash() {
            ssh_edge "cd ${edge_dir_q} 2>/dev/null && find . -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1 || true"
          }

          # Read the previous attempt before this run rewrites the marker.
          pending="$(ssh_edge "cat ${pending_q} 2>/dev/null || true" | tr -d '\r\n')"
          applied="$(ssh_edge "cat ${stamp_q} 2>/dev/null || true" | tr -d '\r\n')"
          before="$(tree_hash | tr -d '\r\n')"

          ssh_edge "mkdir -p ${parent_q} && printf '%s\n' in-progress > ${pending_q}"

          tar -C deploy/edge -czf - . \
            | ssh_edge "mkdir -p ${edge_dir_q} && tar -xzf - -C ${edge_dir_q}"

          after="$(tree_hash | tr -d '\r\n')"
          if [[ ! "${after}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Edge tree hash missing after sync" >&2
            exit 1
          fi
          ssh_edge "printf '%s\n' ${after} > ${pending_q}"

          changed="$(bash deploy/plan-edge-apply.sh \
            --before "${before}" \
            --after "${after}" \
            --pending "${pending}" \
            --applied "${applied}")"
          flags=""
          if [ "${RECREATE_EDGE}" = "true" ]; then
            flags="${flags} --recreate"
          fi
          if [ "${changed}" = "1" ]; then
            flags="${flags} --changed"
          elif [ "${changed}" != "0" ]; then
            echo "Unexpected edge plan result: ${changed}" >&2
            exit 1
          fi

          env_q="$(printf '%q' "${DEPLOY_ENVIRONMENT}")"
          tag_q="$(printf '%q' "${DEPLOY_IMAGE_TAG}")"
          ssh_edge "EDGE_ENVIRONMENT=${env_q} EDGE_IMAGE_TAG=${tag_q} bash ${edge_dir_q}/apply-edge-config.sh${flags}"
          ssh_edge "printf '%s\n' ${after} > ${stamp_q}.tmp && mv ${stamp_q}.tmp ${stamp_q} && rm -f ${pending_q}"
          echo "Edge apply succeeded for tree ${after}"

  deploy:
    name: Deploy Cardhub
    needs: edge
    if: needs.edge.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ needs.edge.outputs.environment }}
    permissions:
      contents: read
      packages: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_ENVIRONMENT: ${{ needs.edge.outputs.environment }}
      DEPLOY_IMAGE_TAG: ${{ needs.edge.outputs.image_tag }}
      DEPLOY_EXPECTED_SHA: ${{ needs.edge.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Same full history as the edge job: this job also refuses when
          # HEAD:deploy is not origin/main:deploy.
          fetch-depth: 0

      - name: Check infra ref and image tag
        shell: bash
        run: bash deploy/resolve-deploy-inputs.sh --assert

      - name: Configure SSH with pinned host key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_KNOWN_HOSTS}" ]]; then
            echo "DEPLOY_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          install -m 600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Log in to GHCR for image availability checks
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for GHCR images
        shell: bash
        run: |
          set -euo pipefail
          for image in ghcr.io/xv-jiaqi/cardhub-api ghcr.io/xv-jiaqi/cardhub-web; do
            found=0
            for _ in {1..30}; do
              if docker manifest inspect "${image}:${DEPLOY_IMAGE_TAG}" >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ "${found}" -ne 1 ]; then
              echo "Timed out waiting for ${image}:${DEPLOY_IMAGE_TAG}" >&2
              exit 1
            fi
          done

      # Keep this step immediately above "Sync deploy files". The GHCR wait
      # above can run for about 10 minutes after the first --assert; this
      # fetch is the check that still matches origin/main at upload time.
      - name: Re-check deploy tree before sync
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          bash deploy/resolve-deploy-inputs.sh --assert

      - name: Sync deploy files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "Refusing to sync deploy files from $(git rev-parse HEAD); workflow ref is ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "Syncing app deploy files from workflow ref ${GITHUB_SHA}; containers will use ${DEPLOY_IMAGE_TAG}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_deploy_dir="/opt/cardhub/${DEPLOY_ENVIRONMENT}/deploy"
          remote_deploy_dir_q="$(printf '%q' "${remote_deploy_dir}")"
          # One list. remote_assert walks every *.sh in it after extract, so a
          # new server script is checked on the VPS without a second name list.
          # The remote shell may be dash; the loop body is POSIX.
          sync_members=(
            docker-compose.yml
            remote-deploy.sh
            backup.sh
            check-backup-log.sh
            image-cleanup.sh
            db
          )
          sh_scripts=()
          for member in "${sync_members[@]}"; do
            case "${member}" in
              *.sh) sh_scripts+=("${member}") ;;
            esac
          done
          if [ "${#sh_scripts[@]}" -eq 0 ]; then
            echo "Sync deploy files whitelist has no scripts" >&2
            exit 1
          fi
          remote_assert="for script in ${sh_scripts[*]}; do path=\"\${deploy_dir}/\${script}\"; if [ ! -f \"\${path}\" ] || [ ! -x \"\${path}\" ]; then printf 'deploy sync failed: %s is missing or not executable\n' \"\${path}\" >&2; exit 1; fi; done"
          tar -C deploy -czf - "${sync_members[@]}" \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${remote}" \
                "mkdir -p ${remote_deploy_dir_q} && tar -xzf - -C ${remote_deploy_dir_q} && deploy_dir=${remote_deploy_dir_q} && ${remote_assert}"

      - name: Deploy on VPS
        shell: bash
        env:
          # Environment variable, not a secret. Empty when the variable is unset.
          PASSWORD_PREHASH_WRITE: ${{ vars.PASSWORD_PREHASH_WRITE }}
        run: |
          set -euo pipefail
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          deploy_environment="$(printf '%q' "${DEPLOY_ENVIRONMENT}")"
          image_tag="$(printf '%q' "${DEPLOY_IMAGE_TAG}")"
          expected_sha="$(printf '%q' "${DEPLOY_EXPECTED_SHA}")"
          remote_script="$(printf '%q' "/opt/cardhub/${DEPLOY_ENVIRONMENT}/deploy/remote-deploy.sh")"
          # Unset or blank keeps the server line. Only true or false is sent,
          # and the raw value is not printed. The remote script writes the key.
          prehash="$(
            # shellcheck disable=SC1091
            source deploy/remote-deploy.sh
            normalize_password_prehash_write
          )"
          case "${prehash}" in
            ""|true|false) ;;
            *)
              echo "PASSWORD_PREHASH_WRITE must be the exact string true or false" >&2
              exit 1
              ;;
          esac
          prehash_prefix=""
          if [ -n "${prehash}" ]; then
            prehash_prefix="PASSWORD_PREHASH_WRITE=${prehash} "
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${remote}" \
            "${prehash_prefix}bash ${remote_script} ${deploy_environment} ${image_tag} ${expected_sha}"
