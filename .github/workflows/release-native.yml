name: Release Native (Desktop / iOS / Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0)'
        required: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10.18.2, run_install: false }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: 'pnpm' }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cardhub/web build
      - run: pnpm --filter @cardhub/native build

      - uses: actions/upload-artifact@v4
        with:
          name: cardhub-desktop-${{ matrix.os }}
          path: apps/cardhub/native/src-tauri/target/release/bundle/**

  # iOS / Android matrices are placeholders; signing secrets must be configured
  # before enabling them in production.
