name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest

    services:
      # Postgres service container backs the API e2e tests so they exercise
      # real Prisma + SQL behaviour instead of mocks. Keep credentials in
      # sync with apps/cardhub/api/.env.example so contributors can copy the
      # same DATABASE_URL locally if they want.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardhub
          POSTGRES_PASSWORD: cardhub
          POSTGRES_DB: cardhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardhub -d cardhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cardhub:cardhub@localhost:5432/cardhub_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Validate Cardhub deploy compose
        run: |
          set -euo pipefail
          # Rendered config contains placeholder database URLs. Do not print it.
          tmp="$(mktemp)"
          ENV_NAME=prod docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config >"${tmp}"
          ENV_NAME=prod docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example --profile migrate config >"${tmp}"
          ENV_NAME=prod docker compose -f deploy/edge/docker-compose.yml --env-file deploy/.env.example config >"${tmp}"
          rm -f "${tmp}"
          bash -n deploy/backup.sh deploy/check-backup-log.sh deploy/remote-deploy.sh deploy/db/split-roles.sh deploy/edge/apply-edge-config.sh
          sh -n deploy/api-entrypoint.sh deploy/migrate-entrypoint.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter must fail when the package or script is missing
        run: bash scripts/pnpm-filter-fail-closed.test.sh

      - name: Generate Prisma client
        run: pnpm --filter @cardhub/api --fail-if-no-match exec pnpm run db:generate

      - name: Apply Prisma migrations to the test database
        run: pnpm --filter @cardhub/api --fail-if-no-match exec pnpm run db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @cardhub/web --fail-if-no-match exec playwright install --with-deps chromium

      - name: Test
        # ubuntu-latest has 4 vCPUs. turbo's default runs every ready test
        # task together, and each vitest/jest then forks about one worker per
        # core. On fa6ecc2 (run 40676902358) @cardhub/web vitest, @cardhub/api
        # jest, and @agent-hub/web vitest overlapped; forum-detail.test.tsx
        # took 5192ms and crossed the 5000ms timeout. Two turbo tasks at a
        # time, with each runner capped at 2 workers below, stays near the
        # core count. Isolated, the web jsdom suite was 27.7s with the default
        # worker count and 35.9s with --maxWorkers=2.
        run: pnpm exec turbo run test --concurrency=2

  deploy-scripts:
    name: Deploy script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Edge plan, deploy tree guard, rollback previous image
        run: |
          bash deploy/plan-edge-apply.test.sh
          bash deploy/deploy-tree-guard.test.sh
          bash deploy/recheck-before-sync.test.sh
          bash deploy/remote-deploy-entrypoint.test.sh
          bash deploy/rollback-preserves-previous-image.test.sh
          bash deploy/migrate-entrypoint.test.sh
          bash deploy/read-previous-image.test.sh
          bash deploy/backup-password.test.sh
          bash deploy/backup-status.test.sh
          bash deploy/check-backup-log.test.sh
          bash deploy/sync-whitelist.test.sh

  audit:
    name: pnpm audit (high+)
    runs-on: ubuntu-latest
    # Run in parallel with verify; failure here is informational but should
    # block merges on truly high-severity advisories.
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # Specific CVEs are ignored via auditConfig.ignoreCves in
        # pnpm-workspace.yaml (see comment there for justification).
        run: pnpm audit --prod --audit-level high

  api-image:
    name: API image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # /health returns 503 unless Postgres answers SELECT 1. Migrations run
      # in a one-shot container before the API process starts. A dummy
      # DATABASE_URL cannot satisfy either check.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardhub
          POSTGRES_PASSWORD: cardhub
          POSTGRES_DB: cardhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cardhub -d cardhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          # The docker exporter cannot emit the default provenance manifest list.
          provenance: false
          tags: cardhub-api:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=api

      - name: Smoke test API image
        run: |
          set -euo pipefail
          name=cardhub-api-smoke
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::API container logs"
              docker logs "$name" || true
              echo "::endgroup::"
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          # --network host lets these containers reach the job's Postgres
          # service at 127.0.0.1:5432 and exposes :4000 to the runner.
          # NODE_ENV=production is baked into the image, so JWT_SECRET must
          # be at least 32 characters and not a banned placeholder.
          # MIGRATE_DATABASE_URL is unset: migrate falls back to DATABASE_URL,
          # and the API container must not receive the migrator URL.
          docker run --rm --network host \
            -e DATABASE_URL='postgresql://cardhub:cardhub@127.0.0.1:5432/cardhub_test?schema=public' \
            --entrypoint /usr/local/bin/migrate-entrypoint.sh \
            cardhub-api:ci

          docker run -d --name "$name" --network host \
            -e DATABASE_URL='postgresql://cardhub:cardhub@127.0.0.1:5432/cardhub_test?schema=public' \
            -e JWT_SECRET='0123456789abcdef0123456789abcdef' \
            cardhub-api:ci

          deadline=$((SECONDS + 60))
          code=""
          while true; do
            code="$(curl -sS -o /tmp/api-health-body -w '%{http_code}' --max-time 2 http://127.0.0.1:4000/health || true)"
            if [ "$code" = "200" ]; then
              echo "API /health returned 200"
              if docker exec "$name" sh -c 'tr "\0" "\n" < /proc/1/environ' | grep -q '^MIGRATE_DATABASE_URL='; then
                echo "API PID 1 environment contains MIGRATE_DATABASE_URL"
                exit 1
              fi
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null | grep -qx true; then
              echo "API container exited before /health returned 200 (last HTTP status: ${code:-none})"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "API /health did not return 200 within 60s (last HTTP status: ${code:-none})"
              if [ -s /tmp/api-health-body ]; then
                echo "Last /health body:"
                cat /tmp/api-health-body
              fi
              exit 1
            fi
            sleep 2
          done
